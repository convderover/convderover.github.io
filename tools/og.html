<!doctype html>
<!-- Social card (1200×630). Rendered by Playwright into assets/img/og-cover.jpg. -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../site.css"><style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#faf8f5}
.card{width:1200px;height:630px;display:grid;grid-template-columns:1fr 520px;align-items:center;padding-left:80px;box-sizing:border-box}
.h{font-family:var(--font-serif);font-style:italic;font-size:40px;color:#807b72;line-height:1}
h1{font-family:var(--font-serif);font-size:112px;line-height:.94;letter-spacing:-.02em;color:#1a1917;margin:10px 0 28px}h1 span{display:block;color:#807b72}
p.l{font-size:25px;color:#55524c;max-width:520px;line-height:1.45}
img{width:560px;height:560px;margin-left:-50px}
</style></head><body><div class="card"><div><p class="h">Hola, soy</p><h1>Roberto Martín<span>Gutiérrez</span></h1><p class="l">Ingeniero biomédico. IA para leer corazones.</p></div><img src="../assets/img/heart-poster.webp" alt=""></div></body></html>
